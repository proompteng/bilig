name: docs-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Stage documentation and generate discovery artifacts
        run: bun scripts/sync-agent-discovery-docs.ts --check
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: .cache/docs-source
          destination: .cache/docs-site
      - name: Preserve raw agent discovery documents
        run: |
          sudo chown -R "$(id -u):$(id -g)" .cache/docs-site
          cp .cache/docs-source/{AGENTS.md,agent-start.txt,agent.json,skill.md,skill.txt,llms-install.md,llms.txt,llms-full.txt} .cache/docs-site/
          cp -R .cache/docs-source/.well-known .cache/docs-site/
      - name: Archive documentation including discovery directories
        run: tar --dereference --hard-dereference --directory .cache/docs-site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
